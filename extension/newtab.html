<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>esuTABs — New Tab</title>
<link rel="stylesheet" href="styles.css" />
<script src="theme-init.js"></script>
</head>

<body>
  <div class="app">
    <header class="sysbar" role="banner">
      <div class="sysbar-left">
        <span id="clock" aria-live="polite" aria-atomic="true">—</span>
      </div>
      <div class="sysbar-right">
        <span id="countdown" aria-live="polite" aria-atomic="true">—</span>
        <div class="theme-toggle" role="tablist" aria-label="Theme">
          <button data-theme="light" aria-label="Light" aria-pressed="false">☀</button>
          <button data-theme="system" aria-label="System" aria-pressed="false">◐</button>
          <button data-theme="dark" aria-label="Dark" aria-pressed="false">☾</button>
        </div>
      </div>
    </header>

    <section class="brand">
      <h1 class="wordmark" aria-label="esuTABs">
        <span class="wm-accent">esu</span><span class="wm-neutral wm-tab">TAB</span><span class="wm-accent">s</span>
      </h1>
      <p class="tagline">Open Source Knowledge, One Tab at a Time</p>
    </section>

    <main class="main">
      <article class="card knowledge-card" id="knowledgeCard">
        <div class="card-head">
          <span class="badge" id="factCategory">Loading</span>
        </div>
        <h2 class="fact-title" id="factTitle">Welcome to esuTABs</h2>
        <p class="fact-desc" id="factDesc">Loading knowledge…</p>
        <div class="card-foot">
          <a id="factSource" class="source-link" href="#" target="_blank" rel="noopener" hidden>Source ↗</a>
          <button class="primary-btn" id="nextFactBtn">Next Fact →</button>
        </div>
      </article>

      <aside class="otd-card" id="onThisDayCard" hidden aria-labelledby="otdLabel">
        <span class="otd-label" id="otdLabel">On this day</span>
        <div class="otd-body">
          <strong id="otdTitle"></strong>
          <span id="otdDesc"></span>
        </div>
      </aside>

      <div class="search-panel" id="searchPanel">
        <div class="search-row">
          <input type="search" id="searchInput" aria-label="Search facts" placeholder="Search facts…" />
          <select id="categoryFilter" aria-label="Filter by category">
            <option value="">All categories</option>
          </select>
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>

      <section class="rss-grid" aria-label="News">
        <div class="rss-col">
          <h3 class="rss-title">
            <img class="rss-logo-img" src="https://cdn.freebiesupply.com/logos/large/2x/open-source-logo-svg-vector.svg" alt="" aria-hidden="true" width="18" height="18" />
            Open Source News
          </h3>
          <ul class="rss-list" id="rssOpenSource"><li class="skeleton">Loading…</li></ul>
        </div>
        <div class="rss-col">
          <h3 class="rss-title">
            <img class="rss-logo-img suse" src="https://documentation.suse.com/assets/SUSELogo.png" alt="" aria-hidden="true" height="18" />
            SUSE News
          </h3>
          <ul class="rss-list" id="rssSuse"><li class="skeleton">Loading…</li></ul>
        </div>
      </section>
    </main>
